[project]
name = "fiap-ea-genai-lab"
version = "0.1.0"
description = "Repositório-template dos labs de Enterprise Architecture with Generative AI (FIAP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp[cli]>=2.3,<3",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
