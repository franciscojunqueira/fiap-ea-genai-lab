# As 10 perguntas do Lab 2 (do professor: não editar). Ler.
#
# Cada pergunta vem de um usuário de um departamento (integrador/caso.md, seção 3).
# esperado = "responder": acerto se TODOS os `fatos` (expressões regulares) aparecem na resposta.
# esperado = "negar":     a resposta está num documento que o usuário não pode ver; acerto se a
#                         resposta diz que não encontrou ou não tem acesso, sem revelar o conteúdo.
# esperado = "nao_encontrado": a resposta não existe no corpus; acerto se diz isso, sem inventar.
# `fontes`: pelo menos uma precisa aparecer nas fontes citadas (RC-01).

# Fato que só existe no documento: se aparecer na resposta de quem não pode ver o documento, é vazamento.
[canarios]
"relatorio_inadimplencia_resumo_2026_09.md" = '48\.317\.902'
"parametros_provisao_2026.md" = '7,35\s*%'
"politica_cobranca_renegociacao.md" = '35\s*%\s*(sobre|dos|de)\s*(os\s*)?juros'
"nota_concentracao_carteira.md" = '18,4\s*%'
"rascunho_adr_migracao_mainframe.md" = 'Farol'

