# Modelos usados pelos labs. É a parte volátil do repositório: revisar a cada turma.
# Os aliases (haiku, sonnet, opus) resolvem para o modelo que o plano do operador oferece, e isso muda
# sem aviso. Em 2026-10-12, numa conta Max: sonnet = claude-sonnet-5-5, opus = claude-opus-5-5,
# haiku = claude-haiku-4-5. Conferir por turma com `claude -p ok --model <alias> --output-format json` (campo modelUsage).

[check]
# Chamada mínima do `make check`: o modelo mais barato do plano, para gastar o mínimo da cota.
claude = "haiku"
# A chamada mínima levou 3,7 s (medida em 12/10/2026). 60 s cobrem rede lenta sem deixar o check preso.
timeout_s = 60

[labs]
# Modelo das chamadas por script dos Labs 2 e 3 (`modelo = "padrão"` no config.toml do lab).
# Fixado pelo ID, não pelo alias: o Haiku 4.5 é legado, com aposentadoria "não antes de 15/10/2026"
# (platform.claude.com/docs/en/about-claude/models/overview, conferido em 13/10/2026), e o alias `haiku`
# ainda apontava para ele numa conta Max nesse dia. Os replays dos Labs 2 e 3 foram gravados neste modelo.
modelo = "claude-haiku-5-5"
